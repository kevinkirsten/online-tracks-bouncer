<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Same mark as the header logo: the lucide "music" glyph on the indigo→purple
    gradient tile. The glyph is drawn slightly larger and heavier than in the
    header so it still reads at 16px.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="11" fill="url(#tile)" />
  <g
    transform="translate(12 12) scale(1.6667)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 18V5l12-2v13" />
    <circle cx="6" cy="18" r="3" />
    <circle cx="18" cy="16" r="3" />
  </g>
</svg>
